<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Commentary</title><link rel=stylesheet href=style.css></head><body>
<div class=wrap style="max-width:520px;margin:30px auto;padding:0 12px"><div class=card><h3 style="margin-top:0">🎙 Live commentary</h3>
<small>Enter the commentary PIN the admin gave you, then press the button. Everyone in the auction hears you, and you hear them. Use <b>headphones</b> so the speaker does not echo into your mic. Tap the same button again to mute / unmute yourself.</small>
<div style="display:grid;gap:10px;margin-top:12px"><input id=pin type=password placeholder="Commentary PIN"><div id=vb></div></div></div></div>
<script type=module>
import {mountVoice} from "./lib.js";
mountVoice({role:"commentary",pin:()=>document.getElementById("pin").value,into:document.getElementById("vb")});
</script></body></html>
