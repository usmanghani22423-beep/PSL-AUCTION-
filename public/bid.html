<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PSL Team Bidding</title><link rel=stylesheet href=style.css></head>
<body><div class=top><b>🏏 PSL TEAM BIDDING</b><span><i id=c class=dot></i><small id=cs>Connecting…</small></span></div>
<div class=wrap style="max-width:640px"><div class=card id=me>Loading…</div><div class=card id=cur style="margin-top:12px"></div><div class=card id=ctl style="margin-top:12px"></div><div class=card id=sq style="margin-top:12px"></div></div>
<div id=toast></div>
<script type=module>import {sb,fmt,esc,ph,loadAll,watch} from "./lib.js";
const u=new URLSearchParams(location.search),TEAM=u.get("team"),CODE=u.get("code");let S={players:[],teams:[],auction:[]},valid=null,busy=false;
const toast=(m,b)=>{const t=document.getElementById("toast");t.textContent=m;t.className="show"+(b?" bad":"");setTimeout(()=>t.className="",4000)};
(async()=>{const {data}=await sb.rpc("check_team",{p_team:TEAM||"",p_code:CODE||""});valid=!!data;draw()})();
watch(["players","teams","auction"],async()=>{S=await loadAll(["players","teams","auction"]);draw()},ok=>{c.className="dot"+(ok?" on":"");cs.textContent=ok?"Live":"Reconnecting…"});
const tn=id=>S.teams.find(t=>t.id===id)?.name||"—";
function draw(){if(valid===false){me.innerHTML="<b style=color:var(--r)>Invalid or expired link.</b> Ask the admin for your team's bidding link.";cur.innerHTML=ctl.innerHTML=sq.innerHTML="";return}
 const t=S.teams.find(x=>x.id===TEAM);if(!t||valid===null)return;const a=S.auction[0]||{},p=S.players.find(x=>x.id===a.player_id),mine=a.bid_team_id===TEAM,live=a.state==="live"&&p;
 me.innerHTML=`<h3>${esc(t.name)}</h3><small>Remaining purse</small> <b style="color:var(--gold)">${fmt(t.purse-t.spent)}</b> · Squad ${t.squad_count}/${t.max_squad}`;
 cur.innerHTML=p?`<div class=hero><img style="width:110px;height:110px" src="${esc(p.image||ph)}" onerror="this.src='${ph}'"><div><h2>${esc(p.name)}</h2><small>${esc(p.country)} · ${esc(p.role)} · Base ${fmt(p.base_price)}</small><div class=price>${fmt(a.current_bid)}</div>
  <div>Highest: <b>${a.bid_team_id?esc(tn(a.bid_team_id)):"no bid yet"}</b>${mine?" (you)":""}</div><h2 id=tmr style="color:var(--gold)"></h2>
  ${a.state==="sold"?`<h2 style="color:var(--g)">SOLD to ${esc(tn(a.bid_team_id))}</h2>`:a.state==="unsold"?'<h2 style="color:var(--r)">UNSOLD</h2>':a.state==="paused"?"<h3>⏸ Paused</h3>":""}</div></div>`:"Waiting for next player…";
 const opts=live?[...(a.bid_team_id?[]:[a.current_bid]),...[500000,1000000,5000000].map(s=>a.current_bid+s)]:[];
 ctl.innerHTML=live?`<div class=row>${opts.map(v=>`<button class=bb data-v=${v} style="flex:1;min-width:140px;padding:14px" ${mine?"disabled":""}>Bid ${fmt(v)}</button>`).join("")}</div>${mine?"<small>You hold the highest bid.</small>":""}`:"<small>Bidding opens when the admin starts a player.</small>";
 sq.innerHTML=`<h3>My squad</h3>`+(S.players.filter(x=>x.team_id===TEAM).map(x=>`<div>${esc(x.name)} <small>${esc(x.role)}</small> · ${fmt(x.sold_price)}</div>`).join("")||"<small>No players yet</small>")}
ctl.onclick=async e=>{const b=e.target.closest(".bb");if(!b||busy)return;busy=true;document.querySelectorAll(".bb").forEach(x=>x.disabled=true);
 const {error}=await sb.rpc("place_bid",{p_team:TEAM,p_code:CODE,p_bid:Number(b.dataset.v)});busy=false;error?toast(error.message,1):toast("Bid placed: "+fmt(b.dataset.v));draw()};
setInterval(()=>{const a=S.auction[0]||{},e=document.getElementById("tmr");if(!e)return;const r=a.state==="live"?a.timer_end-Date.now():a.state==="paused"?a.remaining_ms:null;
 e.textContent=r==null?"":"⏱ "+Math.max(0,Math.ceil(r/1000))+"s";if(a.state==="live"&&r<=0)document.querySelectorAll(".bb").forEach(x=>x.disabled=true)},250);</script></body></html>
