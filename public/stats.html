<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=style.css><title>Statistics – PSL 2027 Mock Auction</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script></head>
<body><div id=nav-root></div><div class=wrap><h1>Auction Statistics</h1><div class=cards id=cs2></div>
<div class=grid style="grid-template-columns:2fr 1fr"><div class=card><h3>Team-wise spending</h3><canvas id=c1 height=130></canvas></div><div class=card><h3>Player status</h3><canvas id=c2></canvas></div></div>
<div class=card style="margin-top:16px"><h3>Teams</h3><div class=tw id=tb></div></div></div><div id=foot-root></div>
<script type=module>import {fmt,esc,sync,mountNav,mountFooter,teamLogo,themeOf} from "./lib.js";mountNav("stats.html");mountFooter();
const put=(e,h)=>{if(e.dataset.h!==h){e.innerHTML=h;e.dataset.h=h}};let S={players:[],teams:[],bids:[]},ch1,ch2;const opt={plugins:{legend:{labels:{color:"#A8B8B1"}}},scales:{x:{ticks:{color:"#A8B8B1"},grid:{color:"#174C3D"}},y:{ticks:{color:"#A8B8B1"},grid:{color:"#174C3D"}}}};
sync(["players","teams","bids"],o=>{Object.assign(S,o);draw()},ok=>{c.className="dot"+(ok?" on":"");cs.textContent=ok?"Live":"Reconnecting…"});
function draw(){const sd=S.players.filter(p=>p.status==="Sold"&&!p.acq),top=[...sd].sort((a,b)=>b.sold_price-a.sold_price)[0],bc={};S.bids.forEach(b=>bc[b.team_id]=(bc[b.team_id]||0)+1);
 const act=Object.keys(bc).sort((a,b)=>bc[b]-bc[a])[0],tn=id=>S.teams.find(t=>t.id===id)?.name,spent=S.teams.reduce((s,t)=>s+t.spent,0),left=S.teams.reduce((s,t)=>s+t.purse-t.spent,0);
 put(cs2,[["Registered players",S.players.length],["Sold (auction)",sd.length],["Unsold",S.players.filter(p=>p.status==="Unsold").length],["Total spending",fmt(spent)],["Remaining combined purse",fmt(left)],["Highest purchased player",top?esc(top.name)+" · "+fmt(top.sold_price):"—"],["Highest bid",fmt(Math.max(0,...S.bids.map(b=>b.amount)))],["Most active team",act?esc(tn(act))+" ("+bc[act]+" bids)":"—"]].map(([a,b])=>`<div class=card><small>${a}</small><b>${b}</b></div>`).join(""));
 const L=S.teams.map(t=>t.name),D=S.teams.map(t=>t.spent),C=S.teams.map(t=>themeOf(t).p);
 if(!ch1&&window.Chart){ch1=new Chart(c1,{type:"bar",data:{labels:L,datasets:[{label:"Spent (Rs.)",data:D,backgroundColor:C}]},options:opt});ch2=new Chart(c2,{type:"doughnut",data:{labels:["Sold","Unsold","Not yet auctioned"],datasets:[{data:[0,0,0],backgroundColor:["#00A86B","#D94343","#174C3D"],borderColor:"#0B3029"}]},options:{plugins:{legend:{labels:{color:"#A8B8B1"}}}}})}
 if(ch1){ch1.data.labels=L;ch1.data.datasets[0].data=D;ch1.data.datasets[0].backgroundColor=C;ch1.update();const sold=S.players.filter(p=>p.status==="Sold").length,un=S.players.filter(p=>p.status==="Unsold").length;ch2.data.datasets[0].data=[sold,un,S.players.length-sold-un];ch2.update()}
 put(tb,`<table><tr><th>Team</th><th>Spent</th><th>Remaining</th><th>Players</th><th>Bids placed</th></tr>${S.teams.map(t=>`<tr><td>${teamLogo(t,22)} ${esc(t.name)}</td><td>${fmt(t.spent)}</td><td>${fmt(t.purse-t.spent)}</td><td>${t.squad_count}/${t.max_squad}</td><td>${bc[t.id]||0}</td></tr>`).join("")}</table>`)}</script></body></html>
