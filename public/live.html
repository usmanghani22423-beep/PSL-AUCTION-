<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PSL 2027 Mock Auction – Live</title><link rel=stylesheet href=style.css>
<style>.stage{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center}.stage img{width:100%;max-width:260px;aspect-ratio:1;object-fit:cover;border-radius:18px;border:4px solid var(--gold)}
.big{font-size:3.4em;font-weight:900;color:var(--gold);line-height:1.1}.hb{font-size:1.4em;margin:4px 0}.bar{height:8px;background:#22306a;border-radius:9px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--g)}
.tick div{padding:7px 0;border-bottom:1px solid #22306a}.tick div:first-child{font-size:1.15em;color:var(--gold)}
@media(max-width:800px){.stage{grid-template-columns:1fr;text-align:center}.stage img{margin:auto;max-width:200px}.big{font-size:2.5em}}</style></head>
<body><div class=top><b>🏏 PSL 2027 MOCK AUCTION</b><span><button class=s id=snd style="padding:4px 10px;min-height:0">🔕 Sound off</button> <i id=c class=dot></i><small id=cs>Connecting…</small></span></div>
<div id=sold><div><h1>SOLD!</h1><h2 id=sp></h2></div></div>
<div class=wrap><div class=card id=cur>Waiting for auction…</div>
<div class=grid style="margin-top:16px"><div><div class=card><h3>Live bids</h3><div class=tick id=tk></div></div><div class=card style="margin-top:16px"><h3>Recently sold</h3><div class=tw id=rec></div></div><div class=card style="margin-top:16px"><h3>Upcoming</h3><div id=up></div></div></div>
<div><div class=card><h3>Team purses</h3><div id=tm></div></div><div class=card style="margin-top:16px"><h3>Top buys</h3><div id=top></div></div><div class=card style="margin-top:16px"><h3>Statistics</h3><div id=st></div></div></div></div>
<div class=card style="margin-top:16px"><h3>Team squads</h3><div id=sqb></div></div>
<p><small>Mock auction for entertainment. Sample players are demo data, not official PSL 2027 players. Read-only view.</small></p></div>
<script type=module>import {sb,fmt,esc,ph,loadAll,sync,squad,foreign} from "./lib.js";
let S={players:[],teams:[],auction:[],history:[],bids:[]},last=null,lastBid="",ac=null,on=false;
const put=(e,h)=>{if(e.dataset.h!==h){e.innerHTML=h;e.dataset.h=h}},tn=id=>S.teams.find(t=>t.id===id)?.name||"—";
snd.onclick=()=>{on=!on;snd.textContent=on?"🔔 Sound on":"🔕 Sound off";if(on&&!ac)ac=new(window.AudioContext||window.webkitAudioContext)()};
const beep=(f,d=.15)=>{if(!on||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)};
const openT=new Set();sqb.addEventListener("toggle",e=>{const t=e.target.dataset?.t;if(t)e.target.open?openT.add(t):openT.delete(t)},true);
sync(["players","teams","auction","history","bids"],o=>{Object.assign(S,o);draw()},ok=>{c.className="dot"+(ok?" on":"");cs.textContent=ok?"Live":"Reconnecting…"});
function draw(){const a=S.auction[0]||{},p=S.players.find(x=>x.id===a.player_id),ps=S.players,hist=[...S.history].sort((x,y)=>new Date(y.at)-new Date(x.at)).slice(0,20);
 put(cur,p?`<div class=stage><img src="${esc(p.image||ph)}" onerror="this.src='${ph}'"><div><span class="badge ${esc(p.status)}">${esc(p.status)}</span> ${foreign(p)?"✈️":""}<h1 style="margin:.2em 0">${esc(p.name)}</h1><div>${esc(p.country)} · ${esc(p.role)}</div><small>${esc(p.bat)} ${p.bowl?"· "+esc(p.bowl):""} · Base ${fmt(p.base_price)}</small>
  <div class=big>${fmt(a.current_bid||p.base_price)}</div><div class=hb>${a.bid_team_id?"🏏 "+esc(tn(a.bid_team_id)):"Waiting for first bid"}</div><h2 id=tmr style="color:var(--gold)"></h2>
  ${a.state==="sold"?`<h2 style="color:var(--g)">SOLD to ${esc(tn(a.bid_team_id))}</h2>`:a.state==="unsold"?'<h2 style="color:var(--r)">UNSOLD</h2>':a.state==="paused"?"<h3>⏸ Paused</h3>":""}</div></div>`:'<h2 style="text-align:center">Waiting for next player…</h2>');
 const key=a.player_id+"|"+a.current_bid;if(lastBid&&key!==lastBid&&a.state==="live")beep(660);lastBid=key;
 if(last===null)last=a.state==="sold"?a.player_id:"";
 else if(a.state==="sold"&&a.player_id!==last&&p){last=a.player_id;sp.textContent=`${p.name} → ${tn(a.bid_team_id)} for ${fmt(a.current_bid)}`;sold.className="show";beep(880,.2);setTimeout(()=>beep(1100,.3),220);setTimeout(()=>sold.className="",4500)}
 const feed=S.bids.filter(b=>b.player_id===a.player_id).sort((x,y)=>new Date(y.at)-new Date(x.at)).slice(0,8);
 put(tk,feed.map(b=>`<div>${esc(tn(b.team_id))} — <b>${fmt(b.amount)}</b> <small>${new Date(b.at).toLocaleTimeString()}</small></div>`).join("")||"<small>No bids yet</small>");
 put(rec,`<table><tr><th>Player</th><th>Team</th><th>Price</th></tr>${hist.map(h=>`<tr><td>${esc(h.name)}</td><td>${esc(h.team||"—")}</td><td>${h.status==="Unsold"?"UNSOLD":fmt(h.price)+(h.status!=="Sold"?" ("+esc(h.status)+")":"")}</td></tr>`).join("")||"<tr><td colspan=3>None yet</td></tr>"}</table>`);
 put(up,ps.filter(x=>["Upcoming","Available"].includes(x.status)).sort((a,b)=>(a.queue??1e9)-(b.queue??1e9)).slice(0,12).map(x=>`<span class=badge style="margin:2px;display:inline-block">${esc(x.name)}</span>`).join("")||"—");
 put(tm,S.teams.map(t=>`<div style="margin-bottom:10px">${t.logo?`<img class=logo src="${t.logo}">`:""}<b>${esc(t.name)}</b> <small>${t.squad_count}/${t.max_squad}</small><div class=bar><i style="width:${Math.max(0,Math.min(100,100-t.spent/t.purse*100))}%"></i></div><small>Left ${fmt(t.purse-t.spent)} of ${fmt(t.purse)}</small></div>`).join(""));
 const sd=ps.filter(x=>x.status==="Sold"&&!x.acq),top=[...sd].sort((x,y)=>y.sold_price-x.sold_price);
 put(document.getElementById("top"),top.slice(0,5).map((x,i)=>`<div>${i+1}. ${esc(x.name)}${foreign(x)?" ✈️":""} <small>${esc(tn(x.team_id))}</small> — <b>${fmt(x.sold_price)}</b></div>`).join("")||"<small>No sales yet</small>");
 put(st,`Players: <b>${ps.length}</b><br>Sold: <b>${sd.length}</b> · Unsold: <b>${ps.filter(x=>x.status==="Unsold").length}</b><br>Average: <b>${fmt(sd.length?sd.reduce((s,x)=>s+x.sold_price,0)/sd.length:0)}</b>`);
 put(sqb,S.teams.map(t=>{const q=ps.filter(p=>p.team_id===t.id&&p.status==="Sold");return `<details data-t="${t.id}" ${openT.has(t.id)?"open":""}><summary><b>${esc(t.name)}</b> <small>${q.length}/${t.max_squad} players · left ${fmt(t.purse-t.spent)}</small></summary>${squad(q)}</details>`}).join(""))}
setInterval(()=>{const a=S.auction[0]||{},e=document.getElementById("tmr");if(!e)return;
 const r=a.state==="live"?(a.timer_end==null?null:a.timer_end-Date.now()):a.state==="paused"?a.remaining_ms:null;e.textContent=r==null?"":"⏱ "+Math.max(0,Math.ceil(r/1000))+"s"},250);</script></body></html>
