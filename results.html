<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=style.css><title>Auction Results – PSL 2027 Mock Auction</title></head>
<body><div id=nav-root></div><div class=wrap><div class=row><h1 style="margin-right:auto">Auction Results</h1><select id=tm><option value="">All teams</option></select><button class=s onclick="window.print()">Print / PDF</button></div>
<div class=cards id=sm></div><div class=card><h3>Sold players</h3><div class=tw id=sold></div></div><div class=card style="margin-top:16px"><h3>Unsold players</h3><div id=un></div></div></div><div id=foot-root></div>
<script type=module>import {fmt,esc,sync,mountNav,mountFooter,teamLogo,foreign} from "./lib.js";mountNav("results.html");mountFooter();
const put=(e,h)=>{if(e.dataset.h!==h){e.innerHTML=h;e.dataset.h=h}};let S={players:[],teams:[],bids:[]},built=false;
sync(["players","teams","bids"],o=>{Object.assign(S,o);if(!built&&S.teams.length){tm.innerHTML+=S.teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");built=true}draw()},ok=>{c.className="dot"+(ok?" on":"");cs.textContent=ok?"Live":"Reconnecting…"});tm.oninput=()=>draw();
function draw(){const cnt={};S.bids.forEach(b=>cnt[b.player_id]=(cnt[b.player_id]||0)+1);const T=id=>S.teams.find(t=>t.id===id);
 const sd=S.players.filter(p=>p.status==="Sold"&&(!tm.value||p.team_id===tm.value)).sort((a,b)=>new Date(b.sold_at)-new Date(a.sold_at)),un=S.players.filter(p=>p.status==="Unsold");
 put(sm,[["Players sold",sd.length],["Total spent",fmt(sd.reduce((s,p)=>s+(p.sold_price||0),0))],["Unsold",un.length]].map(([a,b])=>`<div class=card><small>${a}</small><b>${b}</b></div>`).join(""));
 put(sold,`<table><tr><th>#</th><th>Player</th><th>Role</th><th>Country</th><th>Team</th><th>Price</th><th>Bids</th><th>Type</th></tr>${sd.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.country)}${foreign(p)?" ✈️":""}</td><td>${teamLogo(T(p.team_id),22)} ${esc(T(p.team_id)?.name)}</td><td><b>${fmt(p.sold_price)}</b></td><td>${cnt[p.id]||0}</td><td>${esc(p.acq||"Auction")}</td></tr>`).join("")||"<tr><td colspan=8>No sales yet</td></tr>"}</table>`);
 put(un,un.map(p=>`<span class="badge Unsold" style="margin:2px;display:inline-block">${esc(p.name)}</span>`).join("")||"<small>None</small>")}</script></body></html>
