<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PSL Auction Admin</title><link rel=stylesheet href=style.css>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script></head>
<body><div class=top><b><img src="/assets/psl-logo.png" alt="PSL logo" style="height:30px;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'">PSL 2027 ADMIN</b><span><i id=c class=dot></i><a href=live.html target=_blank>Public page</a> <a href=awards.html target=_blank>Awards</a> <button class=s id=lo>Logout</button></span></div>
<div class=app><nav id=nav></nav><main id=v></main></div><div id=toast></div>
<script type=module>
import {sb,fmt,esc,loadAll,sync,foreign,cat,squad,CATS,balance,rv,themeOf} from "./lib.js";
const S={players:[],teams:[],team_contacts:[],team_codes:[],bids:[],bid_rules:[],announcement:[],rules:[],auction:{},history:[],notifications:[]},STAT=["Available","Upcoming","Unsold"];
let FT=null,lastR={},tab="overview",q="",staged=[],chart,pick="";const $=s=>document.querySelector(s),g=id=>document.getElementById(id);
const toast=(m,b)=>{const t=$("#toast");t.textContent=m;t.className="show"+(b?" bad":"");setTimeout(()=>t.className="",4500)};
const W=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const run=async(f,ok)=>{try{await f();ok&&toast(ok)}catch(e){toast(e.message||String(e),1)}};
const pm=id=>S.players.find(p=>p.id===id),tm=id=>S.teams.find(t=>t.id===id),cn=id=>S.team_contacts.find(c=>c.team_id===id)||{};
const tbl=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")||`<tr><td colspan=${h.length}>No data</td></tr>`}</table></div>`;
const save=(n,rows)=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Sheet1");XLSX.writeFile(wb,n)};
const tsel=(id,v)=>`<select id=${id}><option value="">— team —</option>${S.teams.map(t=>`<option value=${t.id} ${t.id==v?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`;
const ALL=["players","teams","team_contacts","team_codes","bids","bid_rules","announcement","rules","auction","history","notifications"];
function apply(o){for(const k in o)S[k]=k==="auction"?(o[k][0]||{}):o[k];
 if(tab==="auction"&&g("lv1")){const set=(id,h)=>{const e=g(id);if(e&&e.dataset.h!==h){e.innerHTML=h;e.dataset.h=h}};set("lv1",dyn1());set("lv2",dyn2());set("pl",popts());return}
 if(!document.activeElement?.matches("input,select"))render()}
async function refresh(){apply(await loadAll(ALL))}
$("#lo").onclick=async()=>{await sb.auth.signOut();location="login.html"};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session)return location="login.html";
 const ad=await W(sb.from("admins").select("user_id")).catch(()=>[]);if(!ad.length){document.body.innerHTML="<div class=wrap><div class=card>This user is not in the admins table. See README step 5.</div></div>";return}
 const R=sync(["players","teams","auction","history","notifications","team_contacts","bids","bid_rules","announcement","rules"],apply,ok=>$("#c").className="dot"+(ok?" on":""));
 setInterval(async()=>{if(document.hidden||tab!=="auction")return;try{const a=await W(sb.from("auction").select("*")),pid=a[0]?.player_id||"",[b,t]=await Promise.all([W(sb.from("bids").select("*").eq("player_id",pid)),W(sb.from("teams").select("*"))]);
  const sig=JSON.stringify([a,t,b]);if(sig===window._ps)return;window._ps=sig;R.set("auction",a);R.set("teams",t);R.set("bids",[...S.bids.filter(x=>x.player_id!==pid),...b])}catch(e){}},3000)})();
const TABS=[["overview","Overview & Reports"],["players","Players"],["import","Excel Import"],["photos","Player Photos"],["teams","Teams"],["squads","Squads & Retention"],["teamsquads","Team Squads"],["contacts","Team Contacts"],["bidlinks","Team Bid Links"],["auction","Live Control"],["queue","Auction Queue"],["sold","Sold Players"],["unsold","Unsold Players"],["history","History"],["notes","Notifications"],["settings","Settings"]];
$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-k=${k}>${l}</button>`).join("");$("#nav").onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;render()}};
const pRow=p=>[esc(p.id),esc(p.name),esc(p.country),esc(p.role),fmt(p.base_price),`<span class="badge ${p.status}">${p.status}</span>`,esc(tm(p.team_id)?.name||""),p.sold_price?fmt(p.sold_price):""];
const PH=["ID","Name","Country","Role","Base","Status","Team","Sold for"];
function msg(pid){const p=pm(pid),t=tm(p.team_id),c=cn(p.team_id);const x=`🏏 PSL 2027 MOCK AUCTION\n\nCongratulations ${t.name}!\n\nYou have successfully purchased:\n\nPlayer: ${p.name}\nRole: ${p.role}\nCountry: ${p.country}\nFinal Price: ${fmt(p.sold_price)}\n\nRemaining Team Purse: ${fmt(t.purse-t.spent)}\n\nThank you for participating in PSL 2027 Mock Auction!`;
 return {wa:"https://wa.me/"+String(c.whatsapp||"").replace(/\D/g,"")+"?text="+encodeURIComponent(x),mail:"mailto:"+(c.email||"")+"?subject="+encodeURIComponent("PSL 2027 Mock Auction – Player Purchased!")+"&body="+encodeURIComponent(x)}}
const dyn1=()=>{const a=S.auction,p=pm(a.player_id);return `${p?esc(p.name)+" · "+fmt(a.current_bid):"No player loaded"} <span class=badge>${a.state||"idle"}</span>${pm(pick)&&pick!==a.player_id?`<div style="color:var(--gold);font-size:.7em">⚠ ${esc(pm(pick).name)} is selected but NOT live yet – press Start player</div>`:""}`};
const dyn2=()=>{const a=S.auction,p=pm(a.player_id),hb=tm(a.bid_team_id),last={},can=hb&&["live","paused"].includes(a.state),mine=S.bids.filter(b=>b.player_id===a.player_id);
 mine.forEach(b=>{if(!last[b.team_id]||b.amount>last[b.team_id].amount)last[b.team_id]=b});const feed=[...mine].sort((x,y)=>new Date(y.at)-new Date(x.at)).slice(0,8);
 return `<div class=card style="background:#101820;margin:8px 0"><small>Highest bidder (SOLD goes to this team automatically)</small><div class=price>${hb?esc(hb.name)+" · "+fmt(a.current_bid):"No bid yet"}</div>
 <div class=row><button class=g onclick="A.sold()" ${can?"":"disabled"}>${a.state==="sold"?"✔ Already SOLD to "+esc(hb?.name)+" – pick next player":hb?"✔ SOLD to "+esc(hb.name)+" for "+fmt(a.current_bid):"✔ SOLD (waiting for first bid)"}</button><button class=d onclick="A.unsold()">✖ Mark UNSOLD</button><button class=s onclick="A.undo('${esc(a.player_id||"")}')" ${a.state==="sold"&&!p?.acq?"":"disabled"}>↩ Undo SOLD</button><button class=s onclick="A.call('once')" ${can?"":"disabled"}>🔔 Going once</button><button class=s onclick="A.call('twice')" ${can?"":"disabled"}>🔔🔔 Going twice</button><button class=g onclick="A.final()" ${can?"":"disabled"}>⏱ Auto countdown → SOLD</button><button class=s onclick="A.stopFinal()">⏹ Stop countdown</button><button class=s onclick="A.card('${esc(a.player_id||"")}')" ${a.state==="sold"?"":"disabled"}>🖼 SOLD card</button><button class=s onclick="A.edit('${esc(a.player_id||"")}')">Edit player</button><button class=d onclick="A.reset()">Reset auction</button></div></div>
 ${p?`<div class=card style="margin:8px 0"><b>Live bids</b>${feed.map(b=>`<div>${esc(tm(b.team_id)?.name)} — <b>${fmt(b.amount)}</b> <small>${new Date(b.at).toLocaleTimeString()}</small></div>`).join("")||"<small>No bids yet</small>"}</div>`:""}
 ${p?tbl(["Team","Bid status","Last bid","Purse left"],S.teams.map(t=>{const l=last[t.id];return [esc(t.name),a.bid_team_id===t.id?'<span class="badge Sold">🏆 Highest</span>':l?'<span class=badge>Bid placed</span>':"<small>No bid</small>",l?fmt(l.amount):"—",fmt(t.purse-t.spent)]})):""}`};
const popts=()=>S.players.filter(x=>x.status!=="Sold").map(x=>`<option value="${esc(x.name+" · "+x.id)}">`).join("");
const RL=[["foreign_max","Max foreign players per squad"],["min_squad","Minimum squad size"],["reserve_per_slot","Reserve per remaining slot (Rs.)"],["cooldown_sec","Bid cooldown (seconds)"],["min_batter","Minimum Batters"],["min_wk","Minimum Wicketkeepers"],["min_ar","Minimum All-rounders"],["min_bowler","Minimum Bowlers"]];
const V={
overview(){const ps=S.players,sd=ps.filter(p=>p.status==="Sold"&&!p.acq),top=[...sd].sort((a,b)=>b.sold_price-a.sold_price)[0],sum=sd.reduce((a,p)=>a+p.sold_price,0),mt=[...S.teams].sort((a,b)=>b.spent-a.spent)[0];
 return `<div class=cards>${[["Players",ps.length],["Sold",sd.length],["Unsold",ps.filter(p=>p.status==="Unsold").length],["Highest",top?top.name+" · "+fmt(top.sold_price):"—"],["Average",fmt(sd.length?sum/sd.length:0)],["Top spender",mt&&mt.spent?mt.name:"—"],["Total spending",fmt(S.teams.reduce((a,t)=>a+t.spent,0))],["Remaining purse (all teams)",fmt(S.teams.reduce((a,t)=>a+t.purse-t.spent,0))],["Highest bid",fmt(Math.max(0,...S.bids.map(b=>b.amount)))],["Most active team",(()=>{const c={};S.bids.forEach(b=>c[b.team_id]=(c[b.team_id]||0)+1);const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k?(tm(k)?.name||"")+" ("+c[k]+" bids)":"—"})()]].map(([a,b])=>`<div class=card><small>${a}</small><b>${esc(b)}</b></div>`).join("")}</div><div class=card><canvas id=ch height=80></canvas></div><br>`+
 tbl(["Team","Spent","Remaining","Squad"],S.teams.map(t=>[esc(t.name),fmt(t.spent),fmt(t.purse-t.spent),t.squad_count+"/"+t.max_squad]))+`<div class=row><button onclick="A.exportAll()">Export all results (Excel)</button><button class=g onclick="A.report()">Final report (Excel)</button></div>`},
players(){const f=S.players.filter(p=>(p.name+p.country+p.role+p.status).toLowerCase().includes(q));
 return `<div class=row><input id=q placeholder="Search…" value="${esc(q)}" oninput="A.q(this.value)"><button onclick="A.add()">+ Add</button><button class=s onclick="A.exportPlayers()">Export Excel</button><b>${S.players.length} players</b></div>`+tbl([...PH,""],f.map(p=>[...pRow(p),`<button class=s onclick="A.edit('${esc(p.id)}')">Edit</button> <button class=d onclick="A.del('${esc(p.id)}')">Del</button>`]))},
import(){return `<div class=card><h3>Import players from Excel</h3><p><small>Columns: Player ID, Player Name, Player Image URL, Country, Player Role, Batting Style, Bowling Style, Player Category, Base Price, Player Status (Available/Upcoming/Unsold)</small></p><div class=row><input type=file accept=".xlsx,.xls" onchange="A.file(event)"><a class=btn href=player-template.xlsx download>Download sample template</a></div></div>`+
 (staged.length?`<div class=row><b>${staged.filter(o=>!o.err).length} valid / ${staged.length}</b><button onclick="A.commit()">Import valid rows</button></div>`+tbl(["ID","Name","Country","Role","Base","Status","Problem"],staged.map(o=>[esc(o.id),esc(o.name),esc(o.country),esc(o.role),o.base_price,esc(o.status),`<span style=color:var(--r)>${esc(o.err)}</span>`])):"")},
teams(){return S.teams.map(t=>`<div class=card style="margin-bottom:12px"><div class=row>${t.logo?`<img class=logo src="${t.logo}">`:""}<input id=n_${t.id} value="${esc(t.name)}"><input id=ow_${t.id} placeholder="Team owner" value="${esc(t.owner||"")}"><input type=color id=col_${t.id} value="${esc(t.color||"#16A36A")}" title="Fallback colour (the 8 PSL teams use their built-in theme)" style="padding:0;width:44px"><label>Purse <input id=p_${t.id} type=number value=${t.purse}></label><label>Max squad <input id=m_${t.id} type=number value=${t.max_squad}></label><input type=file accept=image/* onchange="A.logo('${t.id}',this)"><button onclick="A.saveTeam('${t.id}')">Save</button></div>
 <small>Spent ${fmt(t.spent)} · Remaining ${fmt(t.purse-t.spent)} · Squad ${t.squad_count}/${t.max_squad} · ${S.players.filter(p=>p.team_id===t.id).map(p=>esc(p.name)+" ("+esc(p.role)+")").join(", ")||"no players"}</small></div>`).join("")},
contacts(){return S.teams.map(t=>{const c=cn(t.id),k=t.id;return `<div class=card style="margin-bottom:12px"><b>${esc(t.name)}</b><div class=row><input id=cm_${k} placeholder="Manager" value="${esc(c.manager)}"><input id=ce_${k} type=email placeholder=Email value="${esc(c.email)}"><input id=cw_${k} placeholder="WhatsApp +92…" value="${esc(c.whatsapp)}"></div>
 <div class=row><label><input type=checkbox id=cp_${k} ${c.email_pref?"checked":""}> Email</label><label><input type=checkbox id=cq_${k} ${c.wa_pref?"checked":""}> WhatsApp share</label><label><input type=checkbox id=cc_${k} ${c.wa_consent?"checked":""}> Manager consented</label><button onclick="A.saveContact('${k}')">Save</button></div></div>`}).join("")},
squads(){const lab=x=>x.name+" · "+x.id,held=S.players.filter(p=>p.acq);
 return `<div class=card><h3>Retention / Direct signing</h3><div class=row><input id=sp list=spl placeholder="Type player name…" style="min-width:240px"><datalist id=spl>${S.players.filter(x=>x.status!=="Sold").map(x=>`<option value="${esc(lab(x))}">`).join("")}</datalist>${tsel("st","")}<select id=sty><option>Retention</option><option>Direct signing</option></select><input id=spr type=number placeholder="Price (0 = free)" value=0 style="width:150px"><button onclick="A.assign()">Assign to team</button></div><small>The player goes straight into that team's squad before the auction. The price (if any) is deducted from the team's purse; 0 deducts nothing. ✈ marks foreign players.</small></div><br>`+tbl(["Player","Team","Type","Price",""],held.map(p=>[esc(p.name)+(foreign(p)?" ✈️":""),esc(tm(p.team_id)?.name),esc(p.acq),fmt(p.sold_price),`<button class=d onclick="A.unassign('${esc(p.id)}')">Remove</button>`]))},
teamsquads(){return `<div class=row><button class=s onclick="A.exportSquads()">Export squads (Excel)</button><button class=g onclick="A.report()">Final report (Excel)</button><button class=s onclick="window.print()">Print / Save as PDF</button></div><div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${S.teams.map(t=>{const ps=S.players.filter(p=>p.team_id===t.id&&p.status==="Sold");return `<div class=card><h3>${esc(t.name)}</h3><small>${ps.length}/${t.max_squad} players · Spent ${fmt(t.spent)} · Left ${fmt(t.purse-t.spent)}</small><div>${balance(ps,S.rules)}</div>${squad(ps)}</div>`}).join("")}</div>`},
queue(){const ok=["Available","Upcoming"],q=S.players.filter(p=>p.queue!=null&&ok.includes(p.status)).sort((a,b)=>a.queue-b.queue),nq=S.players.filter(p=>p.queue==null&&ok.includes(p.status));
 return `<div class=card><h3>Auction queue (${q.length} waiting)</h3><div class=row><select id=qc><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select id=qf><option value="">All countries</option><option value=pk>Pakistani only</option><option value=fo>Foreign only</option></select><button onclick="A.qadd()">Add to queue (${nq.length} not queued)</button><button class=s onclick="A.qclear()">Clear queue</button><button class=s onclick="A.requeue()">Re-queue UNSOLD (${S.players.filter(p=>p.status==="Unsold").length})</button></div><small>Players are added in Excel-list order. Use the filters to line up, for example, all Batters first, then Bowlers. In Live Control, "▶ Next player" starts the first one in the queue.</small></div><br>`+tbl(["#","Player","Role","Base",""],q.slice(0,60).map((p,i)=>[i+1,esc(p.name)+(foreign(p)?" ✈️":""),esc(p.role),fmt(p.base_price),`<button class=s onclick="A.qrm('${esc(p.id)}')">Remove</button>`]))+(q.length>60?"<small>Showing first 60</small>":"")},
photos(){return `<div class=card><h3>Player photos from Excel</h3><p><small>Upload an Excel file with columns <b>Player ID</b> (or <b>Player Name</b>) and <b>Player Image URL</b>. Matching players get their photo; others are ignored. The link must be a direct image link (https://…jpg/png).</small></p><input type=file accept=".xlsx,.xls" onchange="A.photos(event)"></div>`},
bidlinks(){const base=location.origin;return `<p><small>Each team gets a private link with a secret code. Anyone with a link can bid for that team, so send it only to that team's manager. Regenerating invalidates the old links.</small></p><div class=row><button onclick="A.genCodes(0)">Generate missing links (keeps existing)</button><button class=d onclick="A.genCodes(1)">Regenerate ALL (old links stop working)</button></div>`+tbl(["Team","Link","Share"],S.teams.map(t=>{const c=S.team_codes.find(x=>x.team_id===t.id);if(!c)return [esc(t.name),"—",""];const u=`${base}/bid.html?team=${t.id}&code=${c.code}`;return [esc(t.name),`<small>${esc(u)}</small>`,`<button class=s onclick="A.copy('${u}')">Copy</button> <a class=btn target=_blank href="https://wa.me/${String(cn(t.id).whatsapp||"").replace(/\D/g,"")}?text=${encodeURIComponent("Your PSL mock auction bidding link (private): "+u)}">WhatsApp</a>`]}))},
auction(){const pp=pm(pick),lab=x=>x.name+" · "+x.id;
 return `<div class=card><h3 id=lv1>${dyn1()}</h3>
 <div class=row><input id=ap list=pl placeholder="Type player name…" style="min-width:260px" value="${pp?esc(lab(pp)):""}" oninput="A.pickp(this.value)"><datalist id=pl>${popts()}</datalist>
 <b id=bpl style="color:var(--gold)">${pp?"Base "+fmt(pp.base_price):""}</b><label><small>Timer sec (0 = no timer)</small> <input id=sec type=number value=0 style="width:70px"></label><button onclick="A.load()">Start player</button><button class=s onclick="A.pause()">Pause</button><button class=s onclick="A.resume()">Resume</button><button class=g onclick="A.next()">▶ Next player</button></div>
 <div class=row><input id=anin placeholder="📢 Announcement for everyone…" style="flex:1;min-width:200px" value="${esc(S.announcement[0]?.text||"")}"><button onclick="A.say()">Send</button><button class=s onclick="A.say(1)">Clear</button></div>
 <div id=lv2>${dyn2()}</div>
 <details style="margin-top:8px"><summary>Manual bid (admin enters on behalf of a team)</summary><div class=row>${tsel("bt","")}<input id=bp type=number placeholder="Price"><button onclick="A.bid()">Update bid</button>${[500000,1000000,5000000].map(n=>`<button class=s onclick="A.inc(${n})">+${n/1000}k</button>`).join("")}</div></details></div>`},
sold(){return tbl([...PH,""],S.players.filter(p=>p.status==="Sold").map(p=>[...pRow(p),p.acq?esc(p.acq):`<button class=s onclick="A.undo('${esc(p.id)}')">Undo SOLD</button>`]))},unsold(){return tbl(PH,S.players.filter(p=>p.status==="Unsold").map(pRow))},
history(){return `<div class=row><button onclick="A.exportAll()">Export Excel</button></div>`+tbl(["Player ID","Player","Team","Price","Time","Status"],[...S.history].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(x=>[esc(x.player_id),esc(x.name),esc(x.team||""),x.price?fmt(x.price):"",new Date(x.at).toLocaleString(),x.status]))},
notes(){return `<p><small>Email is sent automatically through the server when configured. WhatsApp is <b>manual</b>: the Share button opens WhatsApp with the message ready; you press Send. Delivery is not tracked.</small></p>`+
 tbl(["Player","Team","Email","WhatsApp","Time","Actions"],[...S.notifications].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(n=>{const m=msg(n.player_id);return [esc(n.name),esc(n.team),`<span class="badge ${n.email_status}">${n.email_status}</span> <small>${esc(n.email_error||"")}</small>`,`<span class=badge>${n.wa_status}</span>`,new Date(n.created_at).toLocaleString(),
 `<button onclick="A.mail('${esc(n.player_id)}',1)">Send / resend email</button> <a class="btn s" style="background:#30424E" href="${m.mail}">Open mail app</a> <button class=g onclick="A.share('${esc(n.player_id)}')">WhatsApp Share</button> <button class=s onclick="A.card('${esc(n.player_id)}')">🖼 SOLD card</button>`]}))},
settings(){return `<div class=card><h3>Change password</h3><div class=row><input id=np type=password placeholder="New password (min 8)"><button onclick="A.pw()">Update</button></div></div><br><div class=card><h3>Auction start time</h3><small>Shown as a countdown with a QR code on the audience page while no player is live.</small><div class=row><input id=stt type=datetime-local value="${(()=>{const x=S.announcement[0]?.starts_at;if(!x)return"";const d=new Date(x);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)})()}"><button onclick="A.start()">Save</button><button class=s onclick="A.start(1)">Clear</button></div></div><br><div class=card><h3>Auction rules</h3><small>Foreign limit, purse reserve and bid cooldown are enforced on the server. The minimum squad counts only give warnings.</small>${RL.map(([k,l])=>`<div class=row><label style="min-width:270px">${l}</label><input id=ru_${k} type=number value=${rv(S.rules,k,0)}></div>`).join("")}<button onclick="A.saveRules()">Save rules</button></div><br><div class=card><h3>Bid increments</h3><small>Minimum raise over the current bid. The rule with the highest "from price" that is not above the current bid applies.</small>${tbl(["From price","Minimum raise",""],[...S.bid_rules].sort((a,b)=>a.min_price-b.min_price).map(r=>[fmt(r.min_price),fmt(r.step),`<button class=d onclick="A.rdel(${r.min_price})">Delete</button>`]))}<div class=row><input id=rmin type=number placeholder="From price (Rs.)"><input id=rstep type=number placeholder="Raise (Rs.)"><button onclick="A.radd()">Add / update rule</button></div></div><br><div class=card><h3>Reset everything</h3><small>Also clears retentions and direct signings.</small><div class=row><button class=d onclick="A.resetAll()">Reset everything</button></div></div><br><div class=card><h3>Backup</h3><button onclick="A.backup()">Download full JSON backup</button></div>`}};
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));const h=V[tab]();if(lastR.t===tab&&lastR.h===h)return;lastR={t:tab,h};$("#v").innerHTML=h;
 if(tab==="overview"){chart?.destroy();chart=new Chart($("#ch"),{type:"bar",data:{labels:S.teams.map(t=>t.name),datasets:[{label:"Spent (Rs.)",data:S.teams.map(t=>t.spent),backgroundColor:S.teams.map(t=>themeOf(t).p)}]},options:{plugins:{legend:{labels:{color:"#fff"}}},scales:{x:{ticks:{color:"#B8C5CE"}},y:{ticks:{color:"#B8C5CE"}}}}})}}
const A=window.A={q(v){q=v.toLowerCase();render();const n=g("q");n.focus();n.setSelectionRange(v.length,v.length)},
 add(){const id=prompt("Player ID");if(!id)return;const name=prompt("Name"),bp=Number(prompt("Base price (PKR)"));if(!name||!(bp>0))return toast("Name and base price required",1);
  run(()=>W(sb.from("players").insert({id,name,country:prompt("Country")||"",role:prompt("Role")||"",base_price:bp})),"Added")},
 edit(id){const p=pm(id);if(!p)return;const name=prompt("Name",p.name),country=prompt("Country",p.country),role=prompt("Role",p.role),image=prompt("Image URL",p.image),bp=Number(prompt("Base price",p.base_price));
  if(!(bp>0))return toast("Invalid price",1);run(()=>W(sb.from("players").update({name,country,role,image,base_price:bp}).eq("id",id)),"Saved")},
 del(id){if(pm(id)?.status==="Sold")return toast("Cannot delete a sold player",1);if(confirm("Delete "+id+"?"))run(()=>W(sb.from("players").delete().eq("id",id)),"Deleted")},
 exportPlayers(){save("players.xlsx",S.players.map(p=>({"Player ID":p.id,"Player Name":p.name,"Player Image URL":p.image,"Country":p.country,"Player Role":p.role,"Batting Style":p.bat,"Bowling Style":p.bowl,"Player Category":p.category,"Base Price":p.base_price,"Player Status":p.status})))},
 async file(e){const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),seen=new Set();
  staged=rows.map(r=>{const s=k=>String(r[k]??"").trim(),o={id:s("Player ID"),name:s("Player Name"),image:s("Player Image URL"),country:s("Country"),role:s("Player Role"),bat:s("Batting Style"),bowl:s("Bowling Style"),category:s("Player Category"),base_price:Number(r["Base Price"]),status:s("Player Status")||"Available"},er=[];
   if(!o.id||!o.name||!o.country||!o.role)er.push("Missing field");if(!(o.base_price>0))er.push("Bad base price");if(!STAT.includes(o.status))er.push("Status must be "+STAT.join("/"));
   if(seen.has(o.id))er.push("Duplicate in file");else if(pm(o.id))er.push("Already exists");seen.add(o.id);o.err=er.join("; ");return o});render()},
 commit(){const rows=staged.filter(o=>!o.err).map(({err,...o})=>o);run(async()=>{await W(sb.from("players").insert(rows));staged=[];tab="players"},"Imported "+rows.length)},
 saveTeam(k){const t=tm(k),purse=Number(g("p_"+k).value),m=Number(g("m_"+k).value);if(purse<t.spent||m<t.squad_count)return toast("Purse/squad below current usage",1);run(()=>W(sb.from("teams").update({name:g("n_"+k).value,purse,max_squad:m,color:g("col_"+k).value,owner:g("ow_"+k).value}).eq("id",k)),"Team saved")},
 logo(k,i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;c.getContext("2d").drawImage(im,0,0,96,96);run(()=>W(sb.from("teams").update({logo:c.toDataURL("image/png")}).eq("id",k)),"Logo saved")};im.src=URL.createObjectURL(f)},
 saveContact(k){const w=g("cw_"+k).value.replace(/[\s-]/g,"");if(w&&!/^\+\d{8,15}$/.test(w))return toast("WhatsApp needs country code, e.g. +923001234567",1);
  run(()=>W(sb.from("team_contacts").upsert({team_id:k,manager:g("cm_"+k).value,email:g("ce_"+k).value.trim(),whatsapp:w,email_pref:g("cp_"+k).checked,wa_pref:g("cq_"+k).checked,wa_consent:g("cc_"+k).checked})),"Contact saved")},
 exportSquads(){save("team-squads.xlsx",S.players.filter(p=>p.team_id&&p.status==="Sold").map(p=>({Team:tm(p.team_id)?.name,Player:p.name,Category:cat(p),Country:p.country,Foreign:foreign(p)?"Yes":"No",Type:p.acq||"Auction",Price:p.sold_price})).sort((a,b)=>String(a.Team).localeCompare(b.Team)))},
 qadd(){const c=g("qc").value,f=g("qf").value,ids=S.players.filter(p=>p.queue==null&&["Available","Upcoming"].includes(p.status)&&(!c||cat(p)===c)&&(!f||(f==="fo")===foreign(p))).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).map(p=>p.id);
  if(!ids.length)return toast("Nothing to add",1);run(()=>W(sb.rpc("queue_add",{p_ids:ids})),ids.length+" players added to queue")},
 qclear(){if(confirm("Clear the whole queue?"))run(()=>W(sb.rpc("queue_clear")),"Queue cleared")},
 qrm(id){run(()=>W(sb.from("players").update({queue:null}).eq("id",id)))},
 requeue(){if(confirm("Move all UNSOLD players back to the end of the queue?"))run(()=>W(sb.rpc("requeue_unsold")),"Unsold players re-queued")},
 next(){const q=S.players.filter(p=>p.queue!=null&&["Available","Upcoming"].includes(p.status)).sort((a,b)=>a.queue-b.queue)[0];if(!q)return toast("Queue is empty – add players in the Auction Queue tab",1);
  if(["live","paused"].includes(S.auction.state)&&!confirm("Current player is still live. Switch to "+q.name+"?"))return;pick=q.id;A.load()},
 undo(id){if(id&&confirm("Undo this sale? The player returns to Available and the team gets the money back."))run(()=>W(sb.rpc("undo_sale",{p_player:id})),"Sale undone")},
 async photos(e){const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),byName={},data=[];
  S.players.forEach(p=>byName[p.name.trim().toLowerCase()]=p.id);
  rows.forEach(r=>{const url=String(r["Player Image URL"]||r["Image URL"]||r["Image"]||"").trim(),id=String(r["Player ID"]||"").trim()||byName[String(r["Player Name"]||r["Full Name"]||"").trim().toLowerCase()];if(id&&url&&pm(id))data.push({id,image:url})});
  if(!data.length)return toast("No matching rows (need Player ID or Player Name, plus Player Image URL)",1);run(()=>W(sb.rpc("set_images",{p_data:data})),data.length+" photos updated")},
 radd(){const m=Number(g("rmin").value),st=Number(g("rstep").value);if(!(m>=0)||!(st>0)||g("rmin").value==="")return toast("Enter both numbers",1);run(()=>W(sb.from("bid_rules").upsert({min_price:m,step:st})),"Rule saved")},
 rdel(m){if(confirm("Delete this rule?"))run(()=>W(sb.from("bid_rules").delete().eq("min_price",m)),"Deleted")},
 report(){const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),n);
  add("Teams",S.teams.map(t=>({Team:t.name,"Total purse":t.purse,Spent:t.spent,Remaining:t.purse-t.spent,Players:t.squad_count})));
  add("Squads",S.players.filter(p=>p.team_id&&p.status==="Sold").map(p=>({Team:tm(p.team_id)?.name,Player:p.name,Category:cat(p),Country:p.country,Foreign:foreign(p)?"Yes":"No",Type:p.acq||"Auction",Price:p.sold_price})).sort((a,b)=>String(a.Team).localeCompare(b.Team)));
  add("Sales",S.history.map(h=>({"Player ID":h.player_id,Player:h.name,Team:h.team,Price:h.price,Status:h.status,Time:h.at})));
  add("Unsold",S.players.filter(p=>p.status==="Unsold").map(p=>({"Player ID":p.id,Player:p.name,Role:p.role,Country:p.country,"Base price":p.base_price})));
  XLSX.writeFile(wb,"psl-final-report.xlsx")},
 final(){A.stopFinal();const a0=S.auction;if(!a0.bid_team_id)return toast("No bid yet",1);const bid=a0.current_bid;A.call("once");toast("Countdown started – any new bid cancels it");
  FT=setTimeout(()=>{if(S.auction.current_bid===bid&&S.auction.callout==="once"){A.call("twice");FT=setTimeout(()=>{if(S.auction.current_bid===bid&&S.auction.callout==="twice"&&S.auction.state==="live")A.sold(true)},4000)}},4000)},
 stopFinal(){clearTimeout(FT);FT=null},
 start(clr){const v=g("stt").value;run(()=>W(sb.from("announcement").update({starts_at:clr||!v?null:new Date(v).toISOString()}).eq("id",1)),clr?"Start time cleared":"Start time saved")},
 async card(id){const p=pm(id);if(!p||p.status!=="Sold")return toast("Player is not sold",1);const t=tm(p.team_id),c=document.createElement("canvas");c.width=c.height=1080;const x=c.getContext("2d"),col=t?themeOf(t).p:"#16A36A";
  const gr=x.createLinearGradient(0,0,1080,1080);gr.addColorStop(0,"#101820");gr.addColorStop(1,col);x.fillStyle=gr;x.fillRect(0,0,1080,1080);x.strokeStyle="#D4AF37";x.lineWidth=12;x.strokeRect(30,30,1020,1020);x.textAlign="center";
  x.fillStyle="#D4AF37";x.font="bold 54px Arial";x.fillText("PSL 2027 MOCK AUCTION",540,125);
  if(t?.logo){const im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=t.logo});x.save();x.beginPath();x.arc(540,250,70,0,7);x.clip();x.drawImage(im,470,180,140,140);x.restore()}
  x.fillStyle="#fff";x.font="900 190px Arial";x.fillText("SOLD",540,505);let fs=88;x.font="bold "+fs+"px Arial";while(x.measureText(p.name).width>940&&fs>36){fs-=4;x.font="bold "+fs+"px Arial"}x.fillText(p.name,540,640);
  x.font="46px Arial";x.fillStyle="#B8C5CE";x.fillText((p.country||"")+" · "+(p.role||""),540,710);x.fillStyle="#fff";x.font="bold 60px Arial";x.fillText("to "+(t?.name||""),540,820);
  x.fillStyle="#D4AF37";x.font="900 110px Arial";x.fillText(fmt(p.sold_price),540,950);x.fillStyle="#B8C5CE";x.font="28px Arial";x.fillText("Mock auction for entertainment",540,1030);
  c.toBlob(async b=>{const f=new File([b],"sold-"+p.name.replace(/\W+/g,"-")+".png",{type:"image/png"});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],text:p.name+" sold to "+(t?.name||"")});return}catch(e){}}
   const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;a.click()})},
 say(clr){const t=clr?"":g("anin").value.trim();run(()=>W(sb.from("announcement").update({text:t,updated_at:new Date().toISOString()}).eq("id",1)),clr?"Announcement cleared":"Announcement sent")},
 call(v){run(()=>W(sb.from("auction").update({callout:v}).eq("id",1)))},
 saveRules(){run(()=>W(sb.from("rules").upsert(RL.map(([k])=>({key:k,val:Number(g("ru_"+k).value)||0})))),"Rules saved")},
 genCodes(all){if(all&&!confirm("All old team links will stop working. Continue?"))return;run(()=>W(sb.rpc("generate_codes",{p_all:!!all})).then(refresh),"Links ready")},
 assign(){const x=S.players.find(p=>p.name+" · "+p.id===g("sp").value),t=g("st").value;if(!x||!t)return toast("Pick a player from the list and a team",1);run(async()=>{await W(sb.rpc("assign_player",{p_player:x.id,p_team:t,p_type:g("sty").value,p_price:Number(g("spr").value)||0}));g("sp").value=""},"Assigned: "+x.name)},
 unassign(id){if(confirm("Remove this player from the team squad?"))run(()=>W(sb.rpc("unassign_player",{p_player:id})),"Removed")},
 resetAll(){if(prompt("This also removes retentions & direct signings. Type RESET ALL")==="RESET ALL")run(()=>W(sb.rpc("reset_auction",{p_keep:false})),"Everything reset")},
 copy(u){navigator.clipboard.writeText(u);toast("Link copied")},
 pickp(v){const x=S.players.find(p=>p.id===v||p.name+" · "+p.id===v);pick=x?x.id:"";g("bpl").textContent=x?"Base "+fmt(x.base_price):"";if(x&&x.status!=="Sold"&&x.id!==S.auction.player_id){if(["live","paused"].includes(S.auction.state)&&!confirm("Current player is still live. Switch to "+x.name+"?")){pick="";g("ap").value="";g("bpl").textContent="";return}g("ap").blur();A.load()}},
 load(){const id=pick;if(!id||!pm(id))return toast("Type and select a player from the list first",1);if(pm(id).status==="Sold")return toast("This player is already sold",1);run(async()=>{await W(sb.from("players").update({status:"Available"}).eq("status","Live"));await W(sb.from("players").update({status:"Live",queue:null}).eq("id",id));
  await W(sb.from("auction").update({player_id:id,state:"live",current_bid:pm(id).base_price,bid_team_id:null,callout:null,timer_end:Number(g("sec").value)>0?Date.now()+Number(g("sec").value)*1000:null}).eq("id",1))},"Started: "+pm(id).name)},
 pause(){const a=S.auction;if(a.state==="live")run(()=>W(sb.from("auction").update({state:"paused",remaining_ms:a.timer_end?Math.max(0,a.timer_end-Date.now()):null}).eq("id",1)))},
 resume(){const a=S.auction;if(a.state==="paused")run(()=>W(sb.from("auction").update({state:"live",timer_end:a.remaining_ms==null?null:Date.now()+a.remaining_ms}).eq("id",1)))},
 bid(){const t=g("bt").value,p=Number(g("bp").value),pl=pm(S.auction.player_id);if(!pl||!t)return toast("Pick player and team",1);const T=tm(t);
  if(p<pl.base_price)return toast("Below base price",1);if(T.spent+p>T.purse)return toast("Exceeds team purse",1);if(T.squad_count>=T.max_squad)return toast("Squad full",1);run(async()=>{await W(sb.from("auction").update({bid_team_id:t,current_bid:p,callout:null}).eq("id",1));await W(sb.from("bids").insert({player_id:pl.id,team_id:t,amount:p}))})},
 inc(n){g("bp").value=(Number(g("bp").value)||S.auction.current_bid||0)+n},
 sold(auto){const a=S.auction;if(!a.player_id||!a.bid_team_id)return toast("Set a bid and team first",1);if(!auto&&!confirm("Confirm SOLD to "+tm(a.bid_team_id).name+" for "+fmt(a.current_bid)+"?"))return;
  run(async()=>{const r=await W(sb.rpc("mark_sold",{p_player:a.player_id,p_team:a.bid_team_id,p_price:a.current_bid}));if(r.duplicate)return toast("Already sold – no duplicate created");
   toast("SOLD");tab="notes";await refresh();if(cn(a.bid_team_id).email_pref&&cn(a.bid_team_id).email)A.mail(a.player_id,0,true)})},
 unsold(){const a=S.auction;if(!a.player_id)return;run(async()=>{await W(sb.from("players").update({status:"Unsold"}).eq("id",a.player_id));
  await W(sb.from("history").upsert({player_id:a.player_id,name:pm(a.player_id).name,status:"Unsold"}));await W(sb.from("auction").update({state:"unsold"}).eq("id",1))},"Marked unsold")},
 reset(){if(prompt("Restart the auction (sales, bids, history cleared; retentions & direct signings kept). Type RESET")==="RESET")run(()=>W(sb.rpc("reset_auction",{p_keep:true})),"Auction restarted")},
 mail(id,force,quiet){run(async()=>{const {data:{session}}=await sb.auth.getSession();const r=await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({playerId:id,force:!!force})});
  const j=await r.json().catch(()=>({error:"API not deployed"}));if(!r.ok)throw new Error(j.error);toast(j.skipped?"Email skipped: "+j.skipped:"Email sent")}).finally(()=>refresh())},
 share(id){window.open(msg(id).wa,"_blank");run(()=>W(sb.from("notifications").update({wa_status:"Shared manually",updated_at:new Date().toISOString()}).eq("player_id",id)))},
 pw(){run(()=>sb.auth.updateUser({password:g("np").value}).then(r=>{if(r.error)throw r.error}),"Password updated")},
 backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="psl-backup-"+Date.now()+".json";a.click()},
 exportAll(){save("auction-results.xlsx",S.history.map(h=>({"Player ID":h.player_id,Player:h.name,Team:h.team,"Final Price":h.price,Time:h.at,Status:h.status})))}};
</script></body></html>
